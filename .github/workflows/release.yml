name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and Release
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check zero comments rule
        run: |
          python tools/scan_comment.py
          python tools/scan_comment.py --selfcheck

      - name: Check front hygiene rule
        run: |
          python tools/check_front_hygiene.py

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          $distName = "antigravity-lander-$tag-windows-x64"
          $distDir = "target/dist/$distName"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          
          Copy-Item "target/release/antigravity-lander.exe" -Destination "$distDir/Antigravity-Lander.exe"
          Copy-Item "README.md" -Destination "$distDir/"
          Copy-Item "LICENSE" -Destination "$distDir/"
          
          Compress-Archive -Path "$distDir/*" -DestinationPath "target/$distName.zip" -Force
          
          $exeHash = (Get-FileHash "$distDir/Antigravity-Lander.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "target/$distName.zip" -Algorithm SHA256).Hash.ToLower()
          
          $checksumContent = "$zipHash  $distName.zip`n$exeHash  Antigravity-Lander.exe"
          Set-Content -Path "target/checksums-sha256.txt" -Value $checksumContent -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Antigravity Lander ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/antigravity-lander-*-windows-x64.zip
            target/dist/*/Antigravity-Lander.exe
            target/checksums-sha256.txt
