[package]
name = "antigravity-lander"
version = "1.0.2"
edition = "2024"
description = "Antigravity Lander"
exclude = ["data/**", "*.WebView2/**"]

[[bin]]
name = "antigravity-lander"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
slint = "1.18.1"
sysinfo = "0.39.6"
tray-icon = "0.26.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1.12"
